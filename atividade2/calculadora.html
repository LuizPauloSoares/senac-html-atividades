<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>Calculadora - Sistema Senac</title>
<link rel="stylesheet" href="estilo.css" />  </head>
  <body>
    <header>
      <h1>Senac - Tabão</h1>

    </header>

    <nav>
  <ul>
    <li><a href="home.html">Home</a></li>
    <li><a href="logar.html">Login</a></li>

    <main>
            <h2>Calculadora</h2>
      <div class="calculadora">
        <table border="1" cellspacing="0" class="tabela-calculadora">
          <tr>
            <td colspan="4">
              <input type="text" id="display" readonly />
            </td>
          </tr>
          <tr>
            <td><button>C</button></td>
            <td><button>&lt;</button></td>
            <td><button>/</button></td>
            <td><button>*</button></td>
          </tr>
          <tr>
            <td><button>7</button></td>
            <td><button>8</button></td>
            <td><button>9</button></td>
            <td><button>-</button></td>
          </tr>
          <tr>
            <td><button>4</button></td>
            <td><button>5</button></td>
            <td><button>6</button></td>
            <td><button>+</button></td>
          </tr>
          <tr>
            <td><button>1</button></td>
            <td><button>2</button></td>
            <td><button>3</button></td>
            <td><button>=</button></td>
          </tr>
          <tr>
            <td colspan="3"><button>0</button></td>
            <td><button>.</button></td>
          </tr>
        </table>
      </div>
    </main>
        <footer>
      <h3>Bem vindo ao Sistema Senac</h3>
    </footer>
  </body>
</html>
